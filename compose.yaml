name: ax-for-works
services:
  portal:
    build: .
    image: ax-for-works:local
    restart: unless-stopped
    env_file: .env
    environment:
      AX_DB_HOST: ${AX_CONTAINER_DB_HOST:-${AX_DB_HOST:-127.0.0.1}}
      AX_DB_PORT: ${AX_CONTAINER_DB_PORT:-${AX_DB_PORT:-5432}}
    ports:
      - "443:8443"
    volumes:
      - type: bind
        source: ${AX_TLS_DIR:-/home/wia/.local/share/wianews/tls}
        target: /tls
        read_only: true
      - type: bind
        source: ./config
        target: /app/config
        read_only: true
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,ssl; urllib.request.urlopen('https://127.0.0.1:8443/api/ready',context=ssl._create_unverified_context(),timeout=3)"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
