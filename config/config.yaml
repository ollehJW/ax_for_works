# AX for Works 게이트웨이 설정
# ================================================================
# [반영 방법]
# 이 파일을 저장하면 다음 요청부터 자동 반영됩니다. 재빌드/재시작은 필요 없습니다.
# 잘못된 YAML/설정은 적용하지 않고 마지막 정상 설정으로 계속 서비스합니다.
# 오류 확인: docker logs --tail 100 ax-for-works
# 적용 상태: https://dev-axforwork.wia.co.kr/api/health 의 gateway_config 항목
# 처음 실행할 때는 이 파일이 반드시 유효해야 합니다.
#
# [새 서비스 추가]
# 1. 아래 gateways 목록에 항목을 하나 복사해 추가합니다.
# 2. prefix에는 외부 접속 경로, upstream에는 실제 서비스 주소를 입력합니다.
#    예: /newagent/api/health -> http://10.217.183.72:9912/api/health
#    prefix는 업스트림에 전달할 때 제거됩니다. 쿼리/본문/스트리밍은 유지됩니다.
# 3. 새 서비스의 프론트엔드도 /newagent/ 아래에서 자산과 API를 호출하도록 준비해야 합니다.
#    URL 등록만으로 해당 서비스의 /api, /assets 같은 절대 경로가 자동 수정되지는 않습니다.
# 4. 포털에 카드도 표시하려면 별도로 agents.json에 소개/주소를 추가합니다.
#    agents.json 변경은 현재 docker restart ax-for-works 로 반영합니다.
#
# [작성 규칙]
# - 들여쓰기는 공백 2칸입니다. 탭을 사용하지 마세요.
# - prefix: /로 시작하는 영문 소문자/숫자/하이픈의 단일 경로입니다.
#   끝에 /를 쓰지 마세요. /api와 /assets는 포털 예약 경로입니다. 중복은 금지합니다.
# - upstream: http:// 또는 https:// 주소 + 실제 포트입니다. 경로/쿼리/계정정보는 넣지 마세요.
#   포털 자신의 443 주소가 아니라 대상 서비스의 포트를 사용하세요.
#   Docker 내부의 127.0.0.1은 호스트가 아닌 컨테이너 자신입니다. 호스트 IP/도메인을 쓰세요.
#   HTTPS 인증서는 항상 검증합니다.
# - require_login: true이면 브라우저 진입 시 통합 로그인으로 이동합니다. 기본 false.
# - enabled: true면 연결, false면 연결을 비활성화합니다. 항목 삭제도 즉시 반영됩니다.
# - redirect_hosts: (선택) 서비스가 Location 헤더에 반환하는 내부 host:port 목록입니다.
#   http:// 같은 스킴과 경로는 쓰지 마세요. 모르면 []로 두세요.
#   외부 공개 Host와 upstream의 Host는 자동 인식하므로 여기에 반복할 필요가 없습니다.
# - read_timeout_seconds: (선택) 응답 데이터 대기 제한(초), 기본 660, 범위 1~3600.
# - 서비스 쿠키 Path와 내부 리다이렉트는 prefix에 맞춰 보정합니다.
#   공통 ax_platform_session 쿠키는 모든 서비스에서 사용하므로 Path=/를 유지합니다.
# - 게이트웨이가 모두 필요 없다면 gateways: []로 설정할 수 있습니다.
#
# [추가 예시 — 주석을 해제하고 실제 서비스 값으로 변경]
# 아래 항목은 gateways 목록 안에 동일한 들여쓰기로 추가합니다.
#   - prefix: /newagent
#     upstream: http://10.217.183.72:9912
#     enabled: true
#     require_login: true
#     redirect_hosts: []
#     read_timeout_seconds: 660

version: 1

gateways:
  # 기술 뉴스 서비스: 소개 /wianews/, 실제 서비스 /wianews/agent
  - prefix: /wianews
    upstream: https://dev-axforwork.wia.co.kr:9802
    enabled: true
    require_login: true
    redirect_hosts:
      - 127.0.0.1:9801
      - localhost:9801
    read_timeout_seconds: 660

  # 바이브코딩 서비스: 소개 /wiacoding/, 실제 서비스 /wiacoding/agent
  - prefix: /wiacoding
    upstream: https://dev-axforwork.wia.co.kr:9902
    enabled: true
    require_login: true
    redirect_hosts:
      - 127.0.0.1:9901
      - localhost:9901
    read_timeout_seconds: 660
