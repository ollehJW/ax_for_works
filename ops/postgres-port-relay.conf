# Append to the existing production Supervisor configuration; do not replace it.
[program:postgres-port-relay]
command=/usr/bin/python3 /home/jongwook/ax_for_works/ops/postgres-port-relay.py --port 1004 --target-port 5432
directory=/home/jongwook/ax_for_works
autostart=true
autorestart=true
startsecs=3
startretries=3
stopsignal=TERM
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/data/ax_for_works/logs/postgres-port-relay.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
