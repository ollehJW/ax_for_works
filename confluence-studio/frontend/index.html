<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#f3f6fc">
  <title>계정 연결 · Confluence Studio</title>
  <link rel="stylesheet" href="/studio.css">
  <script type="module" src="/connection.js"></script>
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="brand-mark" aria-hidden="true"></span>Confluence Studio</div>
    <span class="platform">AX for Works</span>
  </header>
  <main>
    <section class="panel" aria-labelledby="form-title">
      <div class="story">
        <p class="service-name" lang="en">Confluence Studio</p>
        <h1>메모에서<br>Confluence 문서로.</h1>
        <p class="intro">회의 메모와 업무 기록을 팀이 함께 읽을 수 있는<br class="wide"> Confluence 페이지로 정리하세요.</p>
        <div class="paper-scene" aria-hidden="true">
          <div class="paper behind"></div>
          <div class="paper front">
            <div class="sheet-header"><i></i><b></b></div>
            <div class="sheet-line"></div><div class="sheet-line short"></div>
            <div class="check-line"><i>✓</i><b></b></div>
            <div class="check-line"><i>✓</i><b></b></div>
          </div>
          <div class="pencil"></div>
        </div>
      </div>
      <div class="connect">
        <h2 id="form-title">Confluence 계정 연결</h2>
        <p id="description">개인 Access Token을 입력해 계정을 연결하세요.</p>
        <form id="token-form" novalidate>
          <label for="token">Confluence Access Token</label>
          <div class="field">
            <input id="token" type="password" autocomplete="off" spellcheck="false" autocapitalize="none" required placeholder="Access Token 입력" aria-describedby="preview-note message">
            <button class="visibility" id="visibility" type="button" aria-controls="token" aria-label="토큰 표시" aria-pressed="false">표시</button>
          </div>
          <p id="message" role="status" aria-live="polite"></p>
          <button class="primary" id="submit" type="submit">연결 확인</button>
          <p id="preview-note">화면 미리보기입니다. 실제 토큰 대신 예시 값을 입력하세요.</p>
        </form>
      </div>
    </section>
  </main>
</body>
</html>
